# Builds the Mac app (LiveTranslator_v<version>_mac.dmg) on GitHub's Mac machines.
# Runs on every push to mac-portable, or by hand: Actions tab > Build Mac app > Run workflow.
# The .dmg appears under the run's "Artifacts".
name: Build Mac app

on:
  push:
    branches: [mac-portable]
    paths-ignore: ["tests/**", ".github/workflows/test-mac.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15          # Apple Silicon (M1 and newer)
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Official python.org Python (same 3.12.10 as the Windows build). Its Tk is recent enough
      # for macOS input methods (Vietnamese Telex/VNI), which older Tk versions handle badly.
      - name: Install Python 3.12.10 (python.org)
        run: |
          set -euo pipefail
          curl -fsSL -o py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target /
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          echo "PYTHON=$PY" >> "$GITHUB_ENV"
          "$PY" -c "import sys, tkinter; print(sys.version); print('Tk', tkinter.Tcl().call('info', 'patchlevel'))"

      # Anthropic's official `ant` CLI for "Sign in with Claude" (same v2.8.0 as vendor/ant.exe on Windows)
      - name: Download ant CLI (macOS arm64)
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -fsSL -o ant.zip https://github.com/anthropics/anthropic-cli/releases/download/v2.8.0/ant_2.8.0_macos_arm64.zip
          echo "5509dc1b4e03bdc97ee7fa790d617cc9d42cd81a8a25f2c60881fc4c2377569f  ant.zip" | shasum -a 256 -c
          unzip -q -o ant.zip -d ant_x
          mv "$(find ant_x -type f -name ant | head -1)" vendor/ant
          chmod +x vendor/ant && rm -rf ant.zip ant_x
          vendor/ant --version

      # Speech models are not in git (too big); fetch the same files from their official sources
      - name: Cache models
        id: models
        uses: actions/cache@v4
        with:
          path: models
          key: models-base.en-vosk-small-0.15-campplus-v1

      - name: Download models
        if: steps.models.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p models/base.en models/spk-onnx
          HF=https://huggingface.co/Systran/faster-whisper-base.en/resolve/main
          for f in config.json model.bin tokenizer.json vocabulary.txt README.md; do
            curl -fsSL -o "models/base.en/$f" "$HF/$f"
          done
          curl -fsSL -o vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-en-us-0.15.zip
          unzip -q vosk.zip && mv vosk-model-small-en-us-0.15 models/vosk-en-small && rm vosk.zip
          curl -fsSL -o models/spk-onnx/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx
          # same files as on the Windows PC
          echo "2a166925539a16005f14ff328359f9b9adb9dc4fb631bb3b227526862e93e2ef  models/base.en/model.bin" | shasum -a 256 -c
          [ "$(md5 -q models/spk-onnx/3dspeaker_speech_campplus_sv_en_voxceleb_16k.onnx)" = "b3934a80bda2e80abdb134fcbc1cdc80" ]
          du -sh models/*

      - name: Build
        run: bash build_mac.sh

      # Install the new .dmg like a user and open it, before anyone downloads it
      - name: Install the new .dmg and open the app for 60 s
        run: |
          set -uo pipefail
          DMG=$(ls dist/*.dmg | head -1)
          hdiutil attach "$DMG" -nobrowse -mountpoint /Volumes/LT
          ditto "/Volumes/LT/Live Translator.app" "/Applications/Live Translator.app"
          hdiutil detach /Volumes/LT
          A="/Applications/Live Translator.app"
          ls "$A/Contents/Frameworks/pymupdf" >/dev/null && echo "pymupdf bundled" || { echo "pymupdf missing"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSRequiresAquaSystemAppearance" "$A/Contents/Info.plist" | grep -q true \
            && echo "light appearance key set" || { echo "NSRequiresAquaSystemAppearance missing"; exit 1; }
          mkdir -p shots
          # open it with the Mac in Dark Mode: the app must still show dark text on its light panes
          defaults write -g AppleInterfaceStyle Dark
          open "$A"
          COUNTS=""
          for i in 1 2 3 4 5 6; do
            sleep 10
            COUNTS="$COUNTS $(pgrep -f "Live Translator.app/Contents/MacOS/" | wc -l | tr -d ' ')"
            [ "$i" = 3 ] && screencapture -x shots/new_build_login_darkmode.png || true
          done
          defaults delete -g AppleInterfaceStyle || true
          echo "process counts every 10 s:$COUNTS"
          LAST=$(echo $COUNTS | awk '{print $NF}')
          # quit like a user (Cmd+Q / Quit): must exit cleanly, no crash report
          QUIT="not tried"
          osascript -e 'tell application id "com.livetranslator.app" to quit' 2>/dev/null &
          OP=$!
          for _ in $(seq 30); do kill -0 $OP 2>/dev/null || break; sleep 1; done
          kill $OP 2>/dev/null || true
          if wait $OP; then
            sleep 5
            pgrep -f "Live Translator.app/Contents/MacOS/" >/dev/null && QUIT="still running after Quit" || QUIT="exited"
          else
            QUIT="Quit event not allowed on this runner"
          fi
          echo "quit: $QUIT"
          pkill -f "Live Translator.app/Contents/MacOS/" || true
          sleep 2
          CRASH=$(ls "$HOME/Library/Logs/DiagnosticReports" 2>/dev/null | grep -i "live" || true)
          echo "crash reports: ${CRASH:-none}"
          # the app must not write inside its own bundle (that breaks the signature on users' Macs)
          codesign --verify --deep --strict "$A" && echo "signature still valid after running"
          ls -d "$HOME/Library/Application Support/LiveTranslator" && echo "settings folder OK"
          {
            echo "## New build: installed and opened"
            echo "- Processes every 10 s:$COUNTS"
            [ "$LAST" -ge 1 ] && [ "$LAST" -le 2 ] && echo "- PASS: running after 60 s, no relaunch loop" || echo "- FAIL"
            echo "- Quit: $QUIT; crash reports: ${CRASH:-none}"
            echo "- Screenshot taken in Dark Mode: screenshot-new-build artifact"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$LAST" -ge 1 ] && [ "$LAST" -le 2 ] && [ -z "$CRASH" ] && [ "$QUIT" != "still running after Quit" ] \
            && codesign --verify --deep --strict "$A"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-new-build
          path: shots/

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: LiveTranslator-mac
          path: dist/*.dmg
          compression-level: 0
          retention-days: 30
